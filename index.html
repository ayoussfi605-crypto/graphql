<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone01 - GraphQL Profile</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- قسم تسجيل الدخول (Login Section) -->
    <div id="login-section" class="login-container">
        <form id="login-form">
            <h1>GraphQL Profile</h1>
            <label for="identifier">Username or Email</label>
            <input id="identifier" type="text" placeholder="Username or Email">
            
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password">
            
            <button type="submit">Sign In</button>
            <p id="error-message"></p>
        </form>
    </div>

    <!-- قسم البروفايل (Profile Section) - مخفي في الأول -->
    <div id="profile-section" class="hidden">
        
        <!-- الكونتينيير الداخلي (80% وموسط) -->
        <div class="dashboard"> 
            
            <!-- Header -->
            <header class="header">
                <div class="logo">Graph-QL</div>
                <div class="online-status"><span class="dot"></span> online</div>
                <button id="logout-btn">Sign Out</button>
            </header>

            <!-- Main Layout (Sidebar + Content) -->
            <div class="main-container">
                
                <!-- Left Sidebar -->
                <aside class="sidebar">
                    <div class="avatar-section" id="avatar-container">
                        <!-- Avatar will be injected here -->
                    </div>
                    <div class="user-info" id="user-info-container">
                        <!-- User info will be injected here -->
                    </div>
                </aside>

                <!-- Right Content -->
                <main class="content">
                    
                    <!-- Statistics Cards -->
                    <div class="stats-row" id="stats-container">
                        <div class="stat-card" id="audit-card">
                            <!-- Audit data will be injected here -->
                        </div>
                        <div class="stat-card" id="xp-card">
                            <!-- XP data will be injected here -->
                        </div>
                        <div class="stat-card" id="level-card">
                            <!-- Level data will be injected here -->
                        </div>
                    </div>

                    <!-- Graphs Section -->
                    <div class="graphs-row">
                        <div class="graph-card exp-graph">
                            <h3>EXP over time</h3>
                            <!-- تحسين الرسم البياني بـ viewBox ليصبح responsive -->
                            <svg id="xp-graph" viewBox="-80 -10 720 360" preserveAspectRatio="none" style="width: 100%; height: 100%; min-height: 250px;"></svg>
                        </div>
                        
                        <div class="graph-card skills-graph">
                            <h3>Skills</h3>
                            <!-- هنا سيتم رسم المهارات بـ SVG -->
                            <div id="skills-chart"></div>
                        </div>
                    </div>
                    
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
