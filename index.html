<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone01 - GraphQL Profile</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div id="login-section" class="login-container">
        <form id="login-form">
            <h1>GraphQL Profile</h1>
            <label for="identifier">Username or Email</label>
            <input id="identifier" type="text" placeholder="Username or Email">
            
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Password">
            
            <button type="submit">Sign In</button>
            <p id="error-message"></p>
        </form>
    </div>

    <div id="profile-section" class="hidden">
        
        <div class="dashboard"> 
            
            <!-- Header -->
            <header class="header">
                <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="#a39c87" xmlns="http://www.w3.org/2000/svg">
                <path d="M14.051 2.751l4.935 2.85c.816-.859 2.173-.893 3.032-.077.148.14.274.301.377.477.589 1.028.232 2.339-.796 2.928-.174.1-.361.175-.558.223v5.699c1.146.273 1.854 1.423 1.58 2.569-.048.204-.127.4-.232.581-.592 1.023-1.901 1.374-2.927.782-.196-.113-.375-.259-.526-.429l-4.905 2.832c.372 1.124-.238 2.335-1.361 2.706-.217.071-.442.108-.67.108-1.181.001-2.139-.955-2.14-2.136 0-.205.029-.41.088-.609l-4.936-2.847c-.816.854-2.171.887-3.026.07-.854-.816-.886-2.171-.07-3.026.283-.297.646-.506 1.044-.603l.001-5.699c-1.15-.276-1.858-1.433-1.581-2.584.047-.198.123-.389.224-.566.592-1.024 1.902-1.374 2.927-.782.177.101.339.228.48.377l4.938-2.85C9.613 1.612 10.26.423 11.39.088 11.587.029 11.794 0 12 0c1.181-.001 2.139.954 2.14 2.134.001.209-.03.418-.089.617zm-.515.877c-.019.021-.037.039-.058.058l6.461 11.19c.026-.009.056-.016.082-.023V9.146c-1.145-.283-1.842-1.442-1.558-2.588.006-.024.012-.049.019-.072l-4.946-2.858zm-3.015.059l-.06-.06-4.946 2.852c.327 1.135-.327 2.318-1.461 2.645-.026.008-.051.014-.076.021v5.708l.084.023 6.461-11.19-.002.001zm2.076.507c-.39.112-.803.112-1.192 0l-6.46 11.189c.294.283.502.645.6 1.041h12.911c.097-.398.307-.761.603-1.044L12.597 4.194zm.986 16.227l4.913-2.838c-.015-.047-.027-.094-.038-.142H5.542l-.021.083 4.939 2.852c.388-.404.934-.653 1.54-.653.627 0 1.19.269 1.583.698z"></path>
                </svg>graph-QL</div>
                <div class="online-status"><span class="dot"></span> online</div>
                <button id="logout-btn">Sign Out</button>
            </header>

            <!-- Main Layout (Sidebar + Content) -->
            <div class="main-container">
                
                <!-- Left Sidebar -->
                <aside class="sidebar">
                    <div class="avatar-section" id="avatar-container">
                        <!-- Avatar will be injected here -->
                    </div>
                    <div class="user-info" id="user-info-container">
                        <!-- User info will be injected here -->
                    </div>
                </aside>

                <!-- Right Content -->
                <main class="content">
                    
                    <!-- Statistics Cards -->
                    <div class="stats-row" id="stats-container">
                        <div class="stat-card" id="audit-card">
                            <!-- Audit data will be injected here -->
                        </div>
                        <div class="stat-card" id="xp-card">
                            <!-- XP data will be injected here -->
                        </div>
                        <div class="stat-card" id="level-card">
                            <!-- Level data will be injected here -->
                        </div>
                    </div>

                    <!-- Graphs Section -->
                    <div class="graphs-row">
                        <div class="graph-card exp-graph">
                            <h3>XP over time</h3>
                            <svg id="xp-graph" viewBox="-80 -10 720 360" preserveAspectRatio="none" style="width: 100%; height: 100%; min-height: 250px;"></svg>
                        </div>
                        
                        <div class="graph-card skills-graph">
                            <h3>Skills</h3>
                            <svg id="skills-chart" viewBox="0 0 500 400" preserveAspectRatio="none" style="width: 100%; height: 100%; min-height: 250px;"></svg>
                        </div>
                    </div>
                    
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
